<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Shot Boxing</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#050816;overflow:hidden;font-family:Arial,sans-serif;color:#fff}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
    .notice{position:fixed;right:16px;bottom:16px;width:min(420px,calc(100vw - 32px));padding:16px 16px 16px 44px;border-radius:18px;background:rgba(5,8,22,.92);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 42px rgba(0,0,0,.42);display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;opacity:0;transform:translateY(18px);pointer-events:none;transition:.3s ease;z-index:3}
    .notice.show{opacity:1;transform:translateY(0);pointer-events:auto}
    .notice.hide{opacity:0;transform:translateY(18px);pointer-events:none}
    .notice img{width:58px;height:58px;border-radius:14px;object-fit:cover}
    .notice b{display:block;margin-bottom:4px;font-size:15px}
    .notice p{margin:0 0 10px;color:#dbe7ff;font-size:13px;line-height:1.35}
    .notice a{display:inline-flex;border:0;border-radius:999px;padding:9px 12px;background:#fff;color:#111827;font-size:12px;font-weight:900;text-decoration:none;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.28)}
    .notice-close{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:#111827;color:#fff;font-weight:900;cursor:pointer;line-height:1}
    @media(max-width:640px){.notice{right:10px;bottom:10px;width:calc(100vw - 20px);grid-template-columns:48px 1fr}.notice img{width:48px;height:48px}}
  </style>
</head>
<body>
  <iframe id="gameFrame" src="https://classroom8.github.io/big-shot-boxing/" allow="fullscreen *; autoplay *; gamepad *; clipboard-read *; clipboard-write *; pointer-lock *" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="notice" id="notice">
    <button class="notice-close" id="noticeClose" aria-label="Dismiss">×</button>
    <img src="https://img.poki-cdn.com/cdn-cgi/image/q%3D78%2Cscq%3D50%2Cwidth%3D204%2Cheight%3D204%2Cfit%3Dcover%2Cf%3Dauto/cd1782b250f70b01d6c054fc6e6ae258683dfc3eb657604d9986495403e4d671/big-shot-boxing-logo.png" alt="Big Shot Boxing icon" />
    <div>
      <b>Big Shot Boxing</b>
      <p>Opening the working source. If it ever looks blocked, use the game toolbar's Open External button.</p>
      <a href="https://classroom8.github.io/big-shot-boxing/" target="_blank" rel="noopener noreferrer">Open Source</a>
    </div>
  </div>
  <script>
    const notice = document.getElementById('notice');
    const closeNotice = () => notice.classList.add('hide');
    document.getElementById('noticeClose').addEventListener('click', closeNotice);
    setTimeout(() => notice.classList.add('show'), 800);
    setTimeout(closeNotice, 5800);
  </script>
</body>
</html>

<script id="blank-space-achievement-bridge">
(function(){
  function send(metric,value,mode){try{parent&&parent.postMessage({type:"blank-space-achievement",blankSpaceGame:"Stick Merge",metric:metric,value:Number(value)||1,mode:mode||"max"},"*");}catch(e){}}
  var oldSet=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){try{var key=String(k||"").toLowerCase();var val=parseInt(String(v||"0").replace(/[^0-9-]/g,""),10)||0;if(key.indexOf("score")>-1||key.indexOf("coin")>-1||key.indexOf("money")>-1)send("best_score",val,"max");if(key.indexOf("level")>-1||key.indexOf("gun")>-1||key.indexOf("weapon")>-1)send("best_level",val,"max");if(key.indexOf("merge")>-1)send("merges",1,"add");}catch(e){} return oldSet.apply(this,arguments);};
  window.addEventListener("click",function(e){try{var t=(e.target&&((e.target.textContent||"")+" "+(e.target.className||"")))||"";if(/merge|upgrade/i.test(t))send("merges",1,"add");}catch(x){}},true);
})();
</script>
